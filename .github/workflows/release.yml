name: Release APK

# Push a tag like "v1.0.0" to build a release APK and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create the release for (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      # Optional signing: set the repository secrets ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD.
      # Without them the APK is signed with a throwaway debug key.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ZWEIER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets configured – the APK is signed with a debug key."
          fi

      - name: Build APK
        env:
          ZWEIER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZWEIER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZWEIER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # optional repository variable: default server built into the app
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          VERSION="${TAG#v}"
          DEFINES=""
          if [ -n "$SERVER_URL" ]; then DEFINES="--dart-define=SERVER_URL=$SERVER_URL"; fi
          flutter build apk --release \
            --build-name="$VERSION" \
            --build-number="${{ github.run_number }}" \
            $DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk "zweier-$TAG.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Zweier ${{ env.TAG }}
          generate_release_notes: true
          files: app/zweier-${{ env.TAG }}.apk
