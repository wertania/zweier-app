name: Docker image

# Builds the backend image and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:latest   (main)
#   ghcr.io/<owner>/<repo>:1.2.3    (tag v1.2.3, or manual run with a version)
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["app/**", "docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version tag for the image (e.g. 1.0.0)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=Zweier backend
            org.opencontainers.image.description=Backend for the Zweier couple app
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
